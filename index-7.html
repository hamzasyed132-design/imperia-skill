 +(L.length?L.map(x=>'<div class="c pc"><div class="pt">'+avt(aem(x.uid))+'<div style="flex:1;min-width:0"><b style="word-break:break-all">'+esc(aem(x.uid))+'</b><div class="mut" style="font-size:13px">'+fdt(x.createdAt)+'</div></div>'+stc(x.status)+'</div><div class="pg2"><div><span>Amount</span><b style="color:var(--p);font-size:20px">'+rup(x.amount)+'</b></div><div><span>Method</span><b>'+esc(x.method)+'</b></div><div><span>Account number</span><b>'+esc(x.account)+'</b></div><div><span>Student balance</span><b>'+rup((AD.um[x.uid]||{}).balance)+'</b></div></div>'+(x.status==='pending'?'<div style="display:flex;gap:10px;margin-top:14px"><button class="btn" data-a="aw" data-id="'+x.id+'" style="flex:1">Mark as paid</button><button class="btn o" data-a="rw" data-id="'+x.id+'" style="flex:1">Reject</button><button class="btn o sm" data-a="cp" data-v="'+esc(x.account)+'">Copy no.</button></div>':'')+'</div>').join(''):'<div class="c emp">'+it('gift','big')+'<h3>Nothing here</h3><p class="mut" style="margin:0">No withdrawals match this filter.</p></div>')+'</div>';

 $('#am').innerHTML='<div class="sh"><h3>Courses</h3><p>Create a course, then add its lessons. Students see every part in order and watch inside the site.</p></div>'

a-i="'+i+'">Add lessons</button></div></div></details>'}).join(''):'<div class="c emp">'+it('book','big')+'<h3>No courses yet</h3><p class="mut" style="margin:0">Create your first course above.</p></div>');
}

function aStu(){
 const q=aq.toLowerCase(),L=AD.users.filter(x=>!q||String(x.email).toLowerCase().includes(q)),rc={};AD.referrals.forEach(r=>{rc[r.referrerUid]=(rc[r.referrerUid]||0)+1});
 $('#am').innerHTML='<div class="sh"><h3>Students</h3><p>'+AD.users.length+' registered &middot; '+AD.users.filter(x=>x.status==='active').length+' active</p></div><input id="aqi" placeholder="Search by email..." value="'+esc(aq)+'" style="margin-bottom:14px">'
 +(L.length?L.map(x=>{const by=x.referredBy?AD.um[x.referredBy]:null;return '<div class="c pc"><div class="pt">'+avt(x.email)+'<div style="flex:1;min-width:0"><b>'+esc(dname(x.email))+'</b><div class="mut" style="font-size:13px;word-break:break-all">'+esc(x.email)+'</div></div>'+stc(x.status)+'</div><div class="pg2"><div><span>Joined</span><b>'+fdt(x.createdAt)+'</b></div><div><span>Referred by</span><b>'+(by?esc(dname(by.email)):'Direct')+'</b></div><div><span>Referrals made</span><b>'+(rc[x.id]||0)+'</b></div><div><span>Balance</span><b>'+rup(x.balance)+'</b></div></div><div style="display:flex;gap:10px;margin-top:14px">'+(x.status==='active'?'<button class="btn o sm dng" data-a="rv" data-id="'+x.id+'">Revoke access</button>':'<button class="btn sm" data-a="ua" data-id="'+x.id+'">Activate manually</button>')+'</div></div>'}).join(''):'<div class="c emp">'+it('users','big')+'<h3>No students found</h3></div>');
 $('#aqi').oninput=e=>{aq=e.target.value;const p=e.target.selectionStart;aStu();const i=$('#aqi');i.focus();i.setSelectionRange(p,p)};
}

function aRef(){
 const R=AD.referrals,g={};R.forEach(r=>{const k=r.referrerUid;(g[k]=g[k]||{n:0,a:0,e:0});g[k].n++;if(r.status==='approved'){g[k].a++;g[k].e+=(+r.commission||0)}});
 const top=Object.entries(g).sort((x,y)=>y[1].a-x[1].a||y[1].n-x[1].n).slice(0,10);
 $('#am').innerHTML='<div class="sh"><h3>Referrals</h3><p>See exactly who joined through whose link, and what commission was credited.</p></div><div class="g kg"><div class="c kp">'+it('users')+'<div><span>Total referrals</span><b>'+R.length+'</b></div></div><div class="c kp">'+it('check')+'<div><span>Approved</span><b>'+R.filter(r=>r.status==='approved').length+'</b></div></div><div class="c kp">'+it('wallet')+'<div><span>Commission credited</span><b>'+rup(R.reduce((a,r)=>a+(+r.commission||0),0))+'</b></div></div></div>'
 +'<div class="c" style="margin-top:20px"><h3>Top affiliates</h3>'+(top.length?top.map(([k,v],n)=>'<div class="row" style="align-items:center"><span style="display:flex;gap:12px;align-items:center"><span class="pn">'+(n+1)+'</span><span><b>'+esc(dname(aem(k)))+'</b><br><span class="mut" style="font-size:13px">'+esc(aem(k))+'</span></span></span><span style="text-align:right"><b>'+v.a+' approved</b> / '+v.n+'<br><span style="color:#067647;font-size:13px;font-weight:700">'+rup(v.e)+' earned</span></span></div>').join(''):'<div class="mut">No referrals yet.</div>')+'</div>'
 +'<div class="c" style="margin-top:20px"><h3>All referral records</h3>'+(R.length?R.map(r=>'<div class="row" style="align-items:center"><span><b>'+esc(r.name||dname(aem(r.id)))+'</b> <span class="mut">joined via</span> <b>'+esc(dname(aem(r.referrerUid)))+'</b><br><span class="mut" style="font-size:13px">'+esc(aem(r.id))+' &middot; '+fdt(r.createdAt)+'</span></span><span style="text-align:right">'+stc(r.status)+(r.status==='approved'?'<br><b style="color:#067647;font-size:13px">+'+rup(r.commission||0)+'</b>':'')+'</span></div>').join(''):'<div class="mut">Referral records appear here when someone signs up with a referral link. If you expected some, make sure the latest Firestore rules are published.</div>')+'</div>';
}

function aSet(){
 $('#am').innerHTML='<div class="sh"><h3>Settings</h3><p>Payment details are shown to students right after they sign up.</p></div><div class="g"><div class="c"><h3>Payment details</h3><label for="pn">Account name</label><input id="pn"><label for="pm">Easypaisa / NayaPay number</label><input id="pm" inputmode="numeric" placeholder="03XXXXXXXXX"><div class="err" id="pe"></div><button class="btn full" data-a="sp">Save payment details</button></div><div class="c"><h3>Program settings</h3><div class="row" style="border:0"><span class="mut">Course price</span><b>'+rup(PRICE)+'</b></div><div class="row"><span class="mut">Affiliate commission</span><b>'+rup(COMM)+' (50%)</b></div><div class="row"><span class="mut">Minimum withdrawal</span><b>'+rup(MIN)+'</b></div><div class="row"><span class="mut">Admin account</span><b style="word-break:break-all;text-align:right">'+esc(ADMIN)+'</b></div><p class="mut" style="font-size:13px;margin:12px 0 0">Prices and limits are set in the site code and enforced by the database rules.</p></div></div>';
 getDoc(doc(db,'config','payment')).then(s=>{const d=s.data()||{};if($('#pn')){$('#pn').value=d.name||'';$('#pm').value=d.number||''}}).catch(()=>{});
}

const parseBulk=(t,start)=>{const isU=s=>/^https?:\/\//i.test(s),out=[];const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);
 for(let k=0;k<lines.length;k++){const p=lines[k].split('|').map(s=>s.trim()),hasT=!isU(p[0]),title=hasT?p[0]:'Part '+(start+out.length+1),links=hasT?p.slice(1):p;
  if(!links[0]||!embed(links[0]))throw new Error('Line '+(k+1)+': a valid Google Drive or YouTube link is missing.');
  const o={title:title||'Part '+(start+out.length+1),url:links[0],u720:'',u480:''};
  if(links[1]){if(!embed(links[1]))throw new Error('Line '+(k+1)+': the 720p link is not valid.');o.u720=links[1]}
  if(links[2]){if(!embed(links[2]))throw new Error('Line '+(k+1)+': the 480p link is not valid.');o.u480=links[2]}
  out.push(o)}
 return out};
const mv=(arr,j,d)=>{const k=j+d;if(k<0||k>=arr.length)return;[arr[j],arr[k]]=[arr[k],arr[j]]};

app.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||!isAdmin()||!AD)return;
 const a=b.dataset.a,id=b.dataset.id,i=+b.dataset.i,j=+b.dataset.j;
 if(a==='nav'){atab=b.dataset.t;aq='';renderAdmin();scrollTo({top:0,behavior:'smooth'});return}
 if(a==='pf'){apf=b.dataset.v;renderAdmin();return}
 if(a==='wf'){awf=b.dataset.v;renderAdmin();return}
 if(a==='cp'){cpy(b.dataset.v,b);return}
 const reload=async()=>{const y=scrollY;await loadAdmin();renderAdmin();scrollTo(0,y)};
 const val=(sel,root=document)=>{const n=root.querySelector(sel);return n?n.value.trim():''};
 const saveC=async fn=>{const C=await getCS();fn(C);await saveCS(C);CSA=C;const y=scrollY;renderAdmin();scrollTo(0,y)};
 b.disabled=true;
 try{
  if(a==='rl'){await reload()}
  else if(a==='ap'){await approvePayment(id);await reload()}
  else if(a==='rp'){if(!confirm('Reject this payment?')){b.disabled=false;return}await updateDoc(doc(db,'payments',id),{status:'rejected'});await reload()}
  else if(a==='aw'){await approveWithdrawal(id);await reload()}
  else if(a==='rw'){if(!confirm('Reject this withdrawal?')){b.disabled=false;return}await updateDoc(doc(db,'withdrawals',id),{status:'rejected'});await reload()}
  else if(a==='ua'){if(!confirm('Activate this student without a payment? No commission will be paid.')){b.disabled=false;return}await updateDoc(doc(db,'users',id),{status:'active'});await reload()}
  else if(a==='rv'){if(!confirm('Remove this student\'s access?')){b.disabled=false;return}await updateDoc(doc(db,'users',id),{status:'pending'});await reload()}
  else if(a==='sp'){const n=val('#pn'),m=val('#pm'),pe=$('#pe');pe.style.color='';if(!n||!/^03\d{9}$/.test(m)){pe.textContent='Enter a name and a valid number (03XXXXXXXXX).';b.disabled=false;return}await setDoc(doc(db,'config','payment'),{name:n,number:m});pe.style.color='#067647';pe.textContent='Saved. Students will see the new details.';b.disabled=false}
  else if(a==='ac'){const t=val('#nct'),d=val('#ncd'),u=val('#ncu'),er=$('#nce');if(!t){er.textContent='Please enter the course name.';b.disabled=false;return}if(u&&!/^https:\/\//.test(u)){er.textContent='The thumbnail link must start with https://';b.disabled=false;return}await saveC(C=>C.push({title:t,desc:d,thumb:u,lessons:[]}));aOpen.add(String(CSA.length-1));renderAdmin()}
  else if(a==='sc'){const r=b.closest('.acb'),t=val('[data-cf=t]',r),d=val('[data-cf=d]',r),u=val('[data-cf=u]',r),er=r.querySelector('[data-ce]');if(!t){er.textContent='Course name cannot be empty.';b.disabled=false;return}if(u&&!/^https:\/\//.test(u)){er.textContent='The thumbnail link must start with https://';b.disabled=false;return}await saveC(C=>{Object.assign(C[i],{title:t,desc:d,thumb:u})})}
  else if(a==='dc'){if(!confirm('Delete this whole course and all its lessons?')){b.disabled=false;return}aOpen.delete(String(i));await saveC(C=>C.splice(i,1))}
  else if(a==='mc'){await saveC(C=>mv(C,i,+b.dataset.d))}
  else if(a==='ls'){const r=b.closest('.lr'),er=r.querySelector('.err'),o={title:val('[data-f=t]',r),url:val('[data-f=u]',r),u720:val('[data-f=u720]',r),u480:val('[data-f=u480]',r)};
   if(!o.title||!embed(o.url)||(o.u720&&!embed(o.u720))||(o.u480&&!embed(o.u480))){er.textContent='Enter a title and valid Google Drive or YouTube links.';b.disabled=false;return}
   await saveC(C=>{C[i].lessons[j]=o})}
  else if(a==='lm'){await saveC(C=>mv(C[i].lessons,j,+b.dataset.d))}
  else if(a==='dl'){if(!confirm('Delete this lesson?')){b.disabled=false;return}await saveC(C=>C[i].lessons.splice(j,1))}
  else if(a==='ab'){const r=b.closest('.bulk'),er=r.querySelector('[data-be]'),t=r.querySelector('textarea').value;er.textContent='';
   let add;try{add=parseBulk(t,(CSA[i].lessons||[]).length);if(!add.length)throw new Error('Paste at least one lesson line.')}catch(x){er.textContent=x.message;b.disabled=false;return}
   aOpen.add(String(i));await saveC(C=>{C[i].lessons=(C[i].lessons||[]).concat(add)})}
 }catch(x){alert(msg(x));b.disabled=false}
});

async function approvePayment(uid){
 await runTransaction(db,async t=>{
  const uR=doc(db,'users',uid),pR=doc(db,'payments',uid),fR=doc(db,'referrals',uid),u=await t.get(uR),p=await t.get(pR);
  if(p.data().status!=='submitted')throw new Error('This payment was already handled.');
  const ru=u.data().referredBy,rR=ru?doc(db,'users',ru):null,r=rR?await t.get(rR):null,f=await t.get(fR);
  const pay=!!(r&&r.data().status==='active');
  t.update(pR,{status:'approved'});t.update(uR,{status:'active'});
  if(pay)t.update(rR,{balance:increment(COMM)});
  if(f.exists())t.update(fR,{status:'approved',commission:pay?COMM:0,approvedAt:serverTimestamp()});
 });
}
async function approveWithdrawal(id){
 await runTransaction(db,async t=>{
  const wR=doc(db,'withdrawals',id),w=await t.get(wR),uR=doc(db,'users',w.data().uid),u=await t.get(uR);
  if(w.data().status!=='pending'||u.data().balance<w.data().amount)throw new Error('This withdrawal cannot be approved (already handled or balance too low).');
  t.update(wR,{status:'paid'});t.update(uR,{balance:increment(-w.data().amount)});
 });
}
