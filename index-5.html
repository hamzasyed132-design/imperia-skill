function vLogin(){
 set('<div class="box"><h2 style="font-size:26px;margin:0 0 4px">Login</h2><label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn full" id="go">Login</button><p class="mut" style="text-align:center;font-size:14px">Naya account? <a href="#signup" style="color:var(--p);font-weight:700">Sign Up</a></p></div>');

function vSignup(){
 set(`<div class="box"><div class="st"><span class="on">1. Sign up</span><span>2. Payment</span><span>3. Proof</span></div><h2 style="font-size:26px;margin:0 0 4px">Account banao</h2><p class="mut" style="margin:0">Email aur password daalo, phir Next karo.</p>
<label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password</label><input id="p" type="password" autocomplete="new-password" placeholder="Kam az kam 6 characters"><label for="r">Referral code (optional)</label><input id="r" value="${esc(new URLSearchParams(location.search).get('ref')||'')}">
<div class="err" id="er"></div><button class="btn full" id="go">Next</button><p class="mut" style="text-align:center;font-size:14px">Pehle se account hai? <a href="#login" style="color:var(--p);font-weight:700">Login</a></p></div>`);
 $('#go').onclick=async()=>{
  const e=$('#e').value.trim(),p=$('#p').value,r=$('#r').value.trim().toUpperCase(),er=$('#er');er.textContent='';
  if(!e||p.length<6)return er.textContent='Email aur kam az kam 6 characters ka password likhein.';
  $('#go').disabled=true;busy=true;
  try{
   const {user}=await createUserWithEmailAndPassword(auth,e,p);me=user;
   let by=null;if(r){const s=await getDoc(doc(db,'refCodes',r));if(s.exists()&&s.data().uid!==user.uid)by=s.data().uid}
   const code=Math.random().toString(36).slice(2,8).toUpperCase();
   await setDoc(doc(db,'users',user.uid),{email:e,refCode:code,referredBy:by,status:'pending',balance:0,createdAt:serverTimestamp()});
   await setDoc(doc(db,'refCodes',code),{uid:user.uid});
   prof=await loadProf();busy=false;location.hash='payment';route();
  }catch(x){busy=false;$('#go').disabled=false;er.textContent=msg(x)}
 };

async function vPay(){
 set('<div class="box"><p class="mut"><div class="sp"></div></p></div>');
 const [pd,ps]=await Promise.all([getDoc(doc(db,'config','payment')),getDoc(doc(db,'payments',me.uid))]);
 const d=pd.data()||{},p=ps.exists()?ps.data():null,sub=p&&p.status==='submitted';
 const st='<div class="st"><span>1. Sign up</span><span class="on">2. Payment</span><span'+(sub?' class="on"':'')+'>3. Proof</span></div>';
 if(sub){
  set('<div class="box">'+st+'<h2 style="font-size:26px;margin:0 0 8px">Verify ho rahi hai</h2><p class="mut">Aap ki payment ka proof mil gaya hai. Verify hote hi course unlock ho jayega.</p><button class="btn full" id="rf">Status check karo</button></div>');
  $('#rf').onclick=async()=>{prof=await loadProf();route()};return;
 }
 set(`<div class="box">${st}<h2 style="font-size:26px;margin:0 0 4px">Payment karo</h2>${p&&p.status==='rejected'?'<div class="err">Pichli payment verify nahi hui. Sahi details ke saath dobara submit karein.</div>':''}<p class="mut" style="margin:0">Neeche di gayi details par Rs. 2,000 bhejo.</p>

<b>Payment ke baad</b><label for="t">Transaction ID</label><input id="t"><label for="s">Aap ka Easypaisa / NayaPay number</label><input id="s" inputmode="numeric" placeholder="03XXXXXXXXX"><div class="err" id="er"></div><button class="btn full" id="go">Submit for Approval</button></div>`);
 $('#go').onclick=async()=>{

async function tCourses(){
 const tb=$('#tb');CS=await loadCourses();
 if(CS===null)return tb.innerHTML='<div class="c">Courses load nahi hue. Page dobara kholo.</div>';
 if(!CS.length)return tb.innerHTML='<div class="c">Courses jald add honge.</div>';
 if(cur!==null&&CS[cur])return tPlay();
 tb.innerHTML='<div class="g">'+CS.map((c,i)=>'<div class="cc" data-c="'+i+'">'+thumb(c,i)+'<div style="padding:14px 6px 6px"><h3 style="font-size:19px">'+esc(c.title)+'</h3><p class="mut" style="margin:0 0 12px;font-size:14px">'+esc(c.desc||'')+'</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="mut" style="font-size:13px;font-weight:600">'+(c.lessons||[]).length+' lessons</span><span class="btn" style="padding:10px 20px;font-size:14px">Start Learning</span></div></div></div>').join('')+'</div>';
 tb.onclick=e=>{const b=e.target.closest('[data-c]');if(b){cur=+b.dataset.c;ln=0;tPlay()}};
}
function tPlay(){
 const c=CS[cur],L=(c.lessons||[]).filter(l=>l.title&&embed(l.url));if(ln>=L.length)ln=0;
 $('#tb').innerHTML='<button class="btn o" id="bk" style="padding:10px 18px;margin-bottom:16px">&larr; Saare courses</button><h2 style="margin:0 0 6px;font-size:28px">'+esc(c.title)+'</h2><p class="mut" style="margin:0 0 20px">'+esc(c.desc||'')+'</p>'
 +(L.length?'<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start"><div style="flex:2 1 440px;min-width:0"><div class="vp"><iframe id="fr" src="'+embed(L[ln].url)+'" allow="autoplay;fullscreen" allowfullscreen></iframe></div><h3 style="margin:14px 0 0">'+esc(L[ln].title)+'</h3></div><div class="c" style="flex:1 1 280px;padding:12px" id="pls"><b style="display:block;padding:8px 10px">Course content ('+L.length+' lessons)</b>'+L.map((l,i)=>'<button class="ls'+(i===ln?' on':'')+'" data-l="'+i+'"><span class="n">'+(i+1)+'</span><span>'+esc(l.title)+'</span></button>').join('')+'</div></div>':'<div class="c">Is course ke lessons jald add honge.</div>');
 $('#bk').onclick=()=>{cur=null;tCourses()};
 if(L.length)$('#pls').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;ln=+b.dataset.l;tPlay();$('#fr').scrollIntoView({behavior:'smooth',block:'center'})};
}
function tAff(){
 const link=location.origin+location.pathname+'?ref='+prof.refCode+'#signup';
 $('#tb').innerHTML=`<div class="g"><div class="c" style="background:var(--ink);color:#fff"><div style="color:#AEB9CC;font-size:14px">Affiliate balance</div><div style="font-size:40px;font-weight:800">Rs. ${prof.balance}</div><div style="color:#AEB9CC;font-size:14px">Har sale par Rs. ${COMM} (50%). Minimum withdrawal Rs. ${MIN}.</div></div>
<div class="c"><b>Aap ka referral link</b><input id="rl" readonly value="${esc(link)}" style="margin:10px 0"><button class="btn full" id="cp">Copy Link</button></div></div>
<div class="g" style="margin-top:20px"><div class="c"><h3>Withdrawal</h3><label for="wa">Amount (Rs.)</label><input id="wa" type="number" placeholder="Minimum ${MIN}"><label for="wm">Method</label><select id="wm"><option>Easypaisa</option><option>NayaPay</option></select><label for="wc">Account number</label><input id="wc" inputmode="numeric" placeholder="03XXXXXXXXX"><div class="err" id="we"></div><button class="btn full" id="wb">Request Withdrawal</button></div>
<div class="c"><h3>Withdrawal history</h3><div id="wh" class="mut"><div class="sp"></div></div></div></div>`;
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('#cp').textContent='Copied!'}catch(e){$('#rl').select()}};
 $('#wb').onclick=async()=>{
  const a=Number($('#wa').value),c=$('#wc').value.trim(),m=$('#wm').value,er=$('#we');
  if(!(a>=MIN))return er.textContent='Minimum withdrawal Rs. '+MIN+' hai.';
  if(a>prof.balance)return er.textContent='Aap ka balance kam hai.';
  if(!/^03\d{9}$/.test(c))return er.textContent='Sahi account number likhein (03XXXXXXXXX).';
  $('#wb').disabled=true;
  try{await addDoc(collection(db,'withdrawals'),{uid:me.uid,amount:a,method:m,account:c,status:'pending',createdAt:serverTimestamp()});vDash()}
  catch(x){$('#wb').disabled=false;er.textContent=msg(x)}
 };
 (async()=>{try{const q=await getDocs(query(collection(db,'withdrawals'),where('uid','==',me.uid)));
  const W=q.docs.map(d=>d.data()).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  $('#wh').innerHTML=W.length?W.map(w=>'<div class="row"><span>Rs. '+w.amount+' ('+esc(w.method)+')</span><b>'+({pending:'Pending',paid:'Paid',rejected:'Rejected'}[w.status]||'')+'</b></div>').join(''):'Abhi koi withdrawal nahi.'}catch(e){$('#wh').textContent='Load nahi hua.'}})();
}

 set('<div class="w sec"><h2>Admin Panel</h2><h3>Payment details (students ko sign up ke baad dikhte hain)</h3><div class="c" style="margin-bottom:28px"><label for="pn">Account name</label><input id="pn"><label for="pm">Number</label><input id="pm" inputmode="numeric"><div class="err" id="pe"></div><button class="btn full" id="ps">Save payment details</button></div><h3>Courses</h3><div class="c" style="margin-bottom:16px"><b>Naya course banao</b><label for="ct">Course ka naam</label><input id="ct" placeholder="Jaise: TikTok Automation"><label for="cd">Chhoti description</label><input id="cd"><label for="cu">Thumbnail image ka link (optional)</label><input id="cu" placeholder="Khali chhor do to khud thumbnail ban jayega"><div class="err" id="ce"></div><button class="btn full" id="cb">Course add karo</button></div><div class="c" style="margin-bottom:16px"><b>Lesson add karo</b><label for="cs">Course chuno</label><select id="cs"></select><label for="lt">Lesson ka title</label><input id="lt"><label for="lu">Video ka link (Google Drive ya YouTube)</label><input id="lu"><div class="err" id="le"></div><button class="btn full" id="la">Lesson add karo</button></div><div id="cl" style="margin-bottom:28px"></div><h3>Payments (pending)</h3><div id="ap" class="mut"><div class="sp"></div></div><h3 style="margin-top:32px">Withdrawals (pending)</h3><div id="aw" class="mut"><div class="sp"></div></div></div>');

 const showC=async()=>{const C=await getCS();$('#cs').innerHTML=C.map((c,i)=>'<option value="'+i+'">'+esc(c.title)+'</option>').join('');

app.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||!isAdmin())return;
 const a=b.dataset.a,id=b.dataset.id;b.disabled=true;
 try{
  if(a==='ap')await approvePayment(id);
  if(a==='rp')await updateDoc(doc(db,'payments',id),{status:'rejected'});
  if(a==='aw')await approveWithdrawal(id);
  if(a==='rw')await updateDoc(doc(db,'withdrawals',id),{status:'rejected'});
  if(a==='dc'){const C=await getCS();C.splice(+b.dataset.i,1);await saveCS(C)}
  if(a==='dl'){const C=await getCS();C[+b.dataset.i].lessons.splice(+b.dataset.j,1);await saveCS(C)}
  vAdmin();
 }catch(x){alert(msg(x));b.disabled=false}
});
async function approvePayment(uid){
 await runTransaction(db,async t=>{
  const uR=doc(db,'users',uid),pR=doc(db,'payments',uid),u=await t.get(uR),p=await t.get(pR);
  if(p.data().status!=='submitted')throw new Error('Pehle hi handle ho chuka hai');
  const ru=u.data().referredBy,rR=ru?doc(db,'users',ru):null,r=rR?await t.get(rR):null;
  t.update(pR,{status:'approved'});t.update(uR,{status:'active'});
  if(r&&r.data().status==='active')t.update(rR,{balance:increment(COMM)});
 });
}
async function approveWithdrawal(id){
 await runTransaction(db,async t=>{
  const wR=doc(db,'withdrawals',id),w=await t.get(wR),uR=doc(db,'users',w.data().uid),u=await t.get(uR);
  if(w.data().status!=='pending'||u.data().balance<w.data().amount)throw new Error('Approve nahi ho sakta');
  t.update(wR,{status:'paid'});t.update(uR,{balance:increment(-w.data().amount)});
 });
}
