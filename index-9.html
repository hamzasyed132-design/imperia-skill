/* ===== v4 THEME ===== */
:root{--p:#5B5BF0;--p2:#8B7CFF;--ink:#0A0D24;--mut:#566079;--bg:#F5F6FD;--ln:#E5E7F6;--gold:#F6B94B;--grad:linear-gradient(120deg,#4F46E5,#7C6CFF 55%,#A78BFA)}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg)}
h1,h2,.logo b,.big,.ce{font-family:'Sora','Plus Jakarta Sans',sans-serif}
nav{background:rgba(10,13,36,.82);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(255,255,255,.07)}
.nl{gap:6px}.nl a{padding:8px 13px;border-radius:99px;color:#C9CCF5;transition:.15s}.nl a:hover{background:rgba(255,255,255,.08);color:#fff}
.nu{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px;padding:5px 14px 5px 5px;border:1px solid rgba(255,255,255,.14);border-radius:99px;background:rgba(255,255,255,.05)}.nu i{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
@media(max-width:560px){.nu span{display:none}.nu{padding:3px}}
.btn{background:var(--grad);box-shadow:0 10px 26px rgba(91,91,240,.32);border-radius:14px}
.btn.o{background:#fff;color:var(--ink);border:1px solid #D9DCF0;box-shadow:none}
.btn.gh{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#fff;box-shadow:none}
.btn.am{background:linear-gradient(120deg,#F6B94B,#FFD27A);color:#2A1B00;box-shadow:0 10px 26px rgba(246,185,75,.35)}
.lbl{background:#ECEBFF;color:var(--p)}
.gt{background:linear-gradient(100deg,#C4C7FF 8%,#fff 48%,#F6B94B 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
input,select,textarea{border-radius:12px;border:1px solid #D9DCF0;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(91,91,240,.15)}
textarea{width:100%;padding:13px;font:16px 'Plus Jakarta Sans',sans-serif;background:#fff;resize:vertical}
.c{border-radius:22px}
.hero{background-image:radial-gradient(900px 520px at 88% -8%,rgba(124,108,255,.6),transparent 62%),radial-gradient(700px 420px at -5% 105%,rgba(79,70,229,.45),transparent 60%),radial-gradient(500px 300px at 50% 120%,rgba(246,185,75,.14),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:auto,auto,auto,56px 56px,56px 56px}
.cta{background:linear-gradient(120deg,#3730A3,#5B5BF0 55%,#8B7CFF)}

let FXI=false,FXO=null,FXT=null,FXB=null;
function fxInit(){
 if(FXI)return;FXI=true;
 const bar=document.createElement('div');bar.id='spb';document.body.appendChild(bar);
 let tk=false;
 const onS=()=>{tk=false;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;bar.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';const n=document.querySelector('nav');if(n)n.classList.toggle('sc',y>24);if(y<1000)document.querySelectorAll('.hero .orb').forEach((e,i)=>{e.style.translate='0 '+Math.round(y*(.1+i*.07))+'px'})};
 addEventListener('scroll',()=>{if(!tk){tk=true;requestAnimationFrame(onS)}},{passive:true});onS();
 const fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches,calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!fine||calm)return;
 const rst=()=>{if(FXT){FXT.style.transform='';FXT.classList.remove('on');FXT=null}if(FXB){FXB.style.translate='';FXB=null}};
 document.addEventListener('pointermove',e=>{
  const el=e.target&&e.target.closest?e.target:null;if(!el)return;
  const hero=el.closest('.hero');
  if(hero&&!document.body.classList.contains('pre')){const r=hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;hero.style.setProperty('--mx',(x+.5)*100+'%');hero.style.setProperty('--my',(y+.5)*100+'%');const hv=hero.querySelector('.hv');if(hv){hv.style.transition='transform .2s linear';hv.style.transform='perspective(1100px) rotateY('+(x*9).toFixed(2)+'deg) rotateX('+(-y*7).toFixed(2)+'deg)';hv.querySelectorAll('.fl2').forEach((f,i)=>{f.style.translate=(-x*34*(i?1:-1)).toFixed(1)+'px '+(-y*24).toFixed(1)+'px'})}}
  const t=el.closest('.crd,.cvc,.soon,.tier,.fe,.cc,.pk');
  if(t!==FXT){if(FXT){FXT.style.transform='';FXT.classList.remove('on')}FXT=t}
  if(t){t.classList.add('tilt','on');const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;t.style.transform='perspective(900px) rotateX('+((.5-y)*7).toFixed(2)+'deg) rotateY('+((x-.5)*9).toFixed(2)+'deg) translateY(-6px)';t.style.setProperty('--gx',(x*100)+'%');t.style.setProperty('--gy',(y*100)+'%')}
  const b=el.closest('.btn.am,.hero .btn,.cta .btn,.pc2 .btn');
  if(b!==FXB){if(FXB)FXB.style.translate='';FXB=b}
  if(b){const r=b.getBoundingClientRect();b.style.translate=((e.clientX-(r.left+r.width/2))*.16).toFixed(1)+'px '+((e.clientY-(r.top+r.height/2))*.28).toFixed(1)+'px'}
 },{passive:true});
 document.addEventListener('pointerleave',rst);
 document.addEventListener('pointerout',e=>{if(!e.relatedTarget){rst();const hv=document.querySelector('.hv');if(hv){hv.style.transform='';hv.querySelectorAll('.fl2').forEach(f=>f.style.translate='')}}});
}
function fxObs(root){
 if(!('IntersectionObserver' in window)){root.querySelectorAll('.rv,.rv2').forEach(n=>n.classList.add('in'));return}
 if(!FXO)FXO=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');FXO.unobserve(x.target)}}),{threshold:.08,rootMargin:'0px 0px -5% 0px'});
 document.body.classList.add('rvon');
 root.querySelectorAll('.rv:not(.in),.rv2:not(.in)').forEach(n=>FXO.observe(n));
}
function fxReveal(root){
 if(me&&isAdmin())return;
 const skip=e=>e.closest('.hero,.au4,.sp4,.rv,.rv2'),pe=e=>e.parentElement&&e.parentElement.closest('.rv,.rv2');
 root.querySelectorAll('.g,.sl4,.tiers,.stat4,.kv,.pkg,.dg,.sg4,.cf,.mqb+*').forEach(p=>{if(p.closest('.hero,.au4,.tbar'))return;[...p.children].forEach((c,i)=>{if(c.classList.contains('rv')||c.classList.contains('rv2')||pe(c))return;c.classList.add('rv2');c.style.setProperty('--d',Math.min(i,8)*75+'ms')})});
 root.querySelectorAll('.sec h2,.sec .lbl,.sh,.ph .lbl,.ph h1,.ph p,.cont,.promo,.wb,.fq,.cta h2,.cta p,.cta .btn,.c.emp,.pgt4>*,.mini').forEach(e=>{if(skip(e))return;const i=[...e.parentElement.children].indexOf(e);e.classList.add('rv2');e.style.setProperty('--d',Math.min(Math.max(i,0),6)*55+'ms')});
}
function fxCount(root){
 root.querySelectorAll('.sc b,.kp b,.big,.ring b,.stat4 b').forEach(el=>{
  if(el.dataset.cu||el.children.length)return;const t=el.textContent.trim(),m=t.match(/^(Rs\. )?([\d,]+)(%?)$/);if(!m)return;
  const to=+m[2].replace(/,/g,'');el.dataset.cu=1;if(!to)return;
  const st=performance.now(),d=1200,pre=m[1]||'',suf=m[3];el.textContent=pre+'0'+suf;
  const f=n=>{const u=Math.min(1,(n-st)/d),e=1-Math.pow(1-u,4);el.textContent=pre+Math.round(to*e).toLocaleString('en-US')+suf;if(u<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
function fx(root){fxInit();root=root||document.getElementById('app');if(!root)return;fxReveal(root);fxObs(root);fxCount(root)}

const parseBulk=(t,start)=>{const isU=s=>/^https?:\/\//i.test(s),out=[];const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);

  if(!links[0]||!embed(links[0]))throw new Error('Line '+(k+1)+': a valid Google Drive or YouTube link is missing.');
  const o={title:title||'Part '+(start+out.length+1),url:links[0],u720:'',u480:''};
  if(links[1]){if(!embed(links[1]))throw new Error('Line '+(k+1)+': the 720p link is not valid.');o.u720=links[1]}
  if(links[2]){if(!embed(links[2]))throw new Error('Line '+(k+1)+': the 480p link is not valid.');o.u480=links[2]}
  out.push(o)}
 return out};

  else if(a==='sd'){if(!confirm('Remove this course from the coming soon list?')){b.disabled=false;return}const L=soonList().slice();L.splice(i,1);await setDoc(doc(db,'config','catalog'),{soon:L.length?L:[{t:'More courses',d:'New courses are added regularly.',c:'Trending'}]},{merge:true});CAT=null;await loadCatalog();renderAdmin()}

  else if(a==='fa'){const q=val('#fq1'),an=val('#fq2'),er=$('#fqe');if(q.length<5||an.length<5){er.textContent='Please write a question and an answer.';b.disabled=false;return}const F=(SITE.faqs||[]).concat([{q,a:an}]);await setDoc(doc(db,'config','site'),{faqs:F},{merge:true});SITE.faqs=F;renderAdmin()}
  else if(a==='fd'){if(!confirm('Remove this FAQ?')){b.disabled=false;return}const F=(SITE.faqs||[]).slice();F.splice(i,1);await setDoc(doc(db,'config','site'),{faqs:F},{merge:true});SITE.faqs=F;renderAdmin()}
  else if(a==='ap'){await approvePayment(id);await reload()}
  else if(a==='rp'){if(!confirm('Reject this payment?')){b.disabled=false;return}await updateDoc(doc(db,'payments',id),{status:'rejected'});await reload()}
  else if(a==='aw'){await approveWithdrawal(id);await reload()}
  else if(a==='rw'){if(!confirm('Reject this withdrawal?')){b.disabled=false;return}await updateDoc(doc(db,'withdrawals',id),{status:'rejected'});await reload()}
  else if(a==='ua'){if(!confirm('Activate this student without a payment? No commission will be paid.')){b.disabled=false;return}await updateDoc(doc(db,'users',id),{status:'active'});await reload()}
  else if(a==='rv'){if(!confirm('Remove this student\'s access?')){b.disabled=false;return}await updateDoc(doc(db,'users',id),{status:'pending'});await reload()}
  else if(a==='du'){if(!confirm('Delete '+aem(id)+' and all their data (payments, referrals, withdrawals)? This cannot be undone.')){b.disabled=false;return}await purgeUsers([id]);await reload()}
  else if(a==='rs'){const er=$('#rse');if((val('#rsi')||'')!=='RESET'){er.textContent='Type RESET (capital letters) to confirm.';b.disabled=false;return}if(!confirm('Delete ALL students and ALL payment, referral and withdrawal records? This cannot be undone.')){b.disabled=false;return}await purgeUsers(AD.users.map(x=>x.id));await reload()}
  else if(a==='sp'){const n=val('#pn'),m=val('#pm'),pe=$('#pe');pe.style.color='';if(!n||!/^03\d{9}$/.test(m)){pe.textContent='Enter a name and a valid number (03XXXXXXXXX).';b.disabled=false;return}await setDoc(doc(db,'config','payment'),{name:n,number:m});pe.style.color='#067647';pe.textContent='Saved. Students will see the new details.';b.disabled=false}
  else if(a==='ac'){const t=val('#nct'),d=val('#ncd'),u=val('#ncu'),er=$('#nce');if(!t){er.textContent='Please enter the course name.';b.disabled=false;return}if(u&&!/^https:\/\//.test(u)){er.textContent='The thumbnail link must start with https://';b.disabled=false;return}await saveC(C=>C.push({title:t,desc:d,thumb:u,lessons:[],cat:val('#ncc'),level:val('#ncl'),obj:val('#nco').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8),published:true}));aOpen.add(String(CSA.length-1));renderAdmin()}
  else if(a==='sc'){const r=b.closest('.acb'),t=val('[data-cf=t]',r),d=val('[data-cf=d]',r),u=val('[data-cf=u]',r),er=r.querySelector('[data-ce]');if(!t){er.textContent='Course name cannot be empty.';b.disabled=false;return}if(u&&!/^https:\/\//.test(u)){er.textContent='The thumbnail link must start with https://';b.disabled=false;return}await saveC(C=>{Object.assign(C[i],{title:t,desc:d,thumb:u,cat:val('[data-cf=cat]',r),level:val('[data-cf=lv]',r),obj:val('[data-cf=obj]',r).split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8),published:val('[data-cf=pub]',r)!=='0'})})}
  else if(a==='dc'){if(!confirm('Delete this whole course and all its lessons?')){b.disabled=false;return}aOpen.delete(String(i));await saveC(C=>C.splice(i,1))}
  else if(a==='mc'){await saveC(C=>mv(C,i,+b.dataset.d))}
  else if(a==='ls'){const r=b.closest('.lr'),er=r.querySelector('.err'),o={title:val('[data-f=t]',r),url:val('[data-f=u]',r),u720:val('[data-f=u720]',r),u480:val('[data-f=u480]',r)};
   if(!o.title||!embed(o.url)||(o.u720&&!embed(o.u720))||(o.u480&&!embed(o.u480))){er.textContent='Enter a title and valid Google Drive or YouTube links.';b.disabled=false;return}
   await saveC(C=>{C[i].lessons[j]=o})}
  else if(a==='lm'){await saveC(C=>mv(C[i].lessons,j,+b.dataset.d))}
  else if(a==='dl'){if(!confirm('Delete this lesson?')){b.disabled=false;return}await saveC(C=>C[i].lessons.splice(j,1))}
  else if(a==='ab'){const r=b.closest('.bulk'),er=r.querySelector('[data-be]'),t=r.querySelector('textarea').value;er.textContent='';
   let add;try{add=parseBulk(t,(CSA[i].lessons||[]).length);if(!add.length)throw new Error('Paste at least one lesson line.')}catch(x){er.textContent=x.message;b.disabled=false;return}
   aOpen.add(String(i));await saveC(C=>{C[i].lessons=(C[i].lessons||[]).concat(add)})}
 }catch(x){alert(msg(x));b.disabled=false}
});

async function purgeUsers(ids){
 const S=new Set(ids),J=[];
 ids.forEach(id=>{const u=AD.um[id]||{};J.push(()=>deleteDoc(doc(db,'users',id)),()=>deleteDoc(doc(db,'payments',id)),()=>deleteDoc(doc(db,'referrals',id)));if(u.refCode)J.push(()=>deleteDoc(doc(db,'refCodes',u.refCode)))});
 AD.withdrawals.filter(w=>S.has(w.uid)).forEach(w=>J.push(()=>deleteDoc(doc(db,'withdrawals',w.id))));
 AD.referrals.filter(r=>S.has(r.referrerUid)).forEach(r=>J.push(()=>deleteDoc(doc(db,'referrals',r.id))));
 for(let i=0;i<J.length;i+=20)await Promise.all(J.slice(i,i+20).map(f=>f()));
}
async function approvePayment(uid){
 await runTransaction(db,async t=>{
  const uR=doc(db,'users',uid),pR=doc(db,'payments',uid),fR=doc(db,'referrals',uid),u=await t.get(uR),p=await t.get(pR);
  if(p.data().status!=='submitted')throw new Error('This payment was already handled.');
  const ru=u.data().referredBy,rR=ru?doc(db,'users',ru):null,r=rR?await t.get(rR):null,f=await t.get(fR);
  const pay=!!(r&&r.data().status==='active');
  t.update(pR,{status:'approved'});t.update(uR,{status:'active'});
  if(pay)t.update(rR,{balance:increment(COMM)});
  if(f.exists())t.update(fR,{status:'approved',commission:pay?COMM:0,approvedAt:serverTimestamp()});
 });
}
async function approveWithdrawal(id){
 await runTransaction(db,async t=>{
  const wR=doc(db,'withdrawals',id),w=await t.get(wR),uR=doc(db,'users',w.data().uid),u=await t.get(uR);
  if(w.data().status!=='pending'||u.data().balance<w.data().amount)throw new Error('This withdrawal cannot be approved (already handled or balance too low).');
  t.update(wR,{status:'paid'});t.update(uR,{balance:increment(-w.data().amount)});
 });
}
