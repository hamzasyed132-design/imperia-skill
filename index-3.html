<style>
:root{--p:#1D4ED8;--ink:#0B1F3A;--mut:#51607A;--bg:#EEF5FF;--ln:#E3E8F0}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{text-decoration:none;color:inherit}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
nav{background:#fff;border-bottom:1px solid var(--ln)}nav .w{padding:14px 20px}
.logo{display:flex;align-items:center;gap:10px;line-height:1.1}.logo b{display:block;font-size:19px;letter-spacing:2px}.logo i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:6px;color:var(--p)}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:12px;padding:14px 26px;font:700 16px Manrope,sans-serif;cursor:pointer;text-align:center}

.sec{padding:64px 20px}.wh{background:#fff}

.c{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:24px}.wh .c{background:var(--bg)}
.mut{color:var(--mut)}

label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select{width:100%;border:1px solid #D0D7E2;border-radius:10px;padding:13px;font:16px Manrope,sans-serif;background:#fff}

.aff{background:var(--p);color:#fff}

@keyframes rot{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.7}}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp{width:28px;height:28px;border:3px solid #D0E0FA;border-top-color:var(--p);border-radius:50%;animation:rot .8s linear infinite;margin:10px 0}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.splash svg{animation:pulse 1.2s ease-in-out infinite}.splash .sp{margin:0}
#app>*{animation:fade .35s ease}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}
.th .tl{position:absolute;top:16px;left:18px;font-size:11px;letter-spacing:3px;font-weight:700;opacity:.85}
.th .tg{position:absolute;top:14px;right:16px;background:#F59E0B;color:#0B1F3A;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px}
.th .tt{font-size:clamp(20px,3.4vw,27px);font-weight:800;line-height:1.15;max-width:78%}
.th .pb{position:absolute;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.cc{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:12px;cursor:pointer;transition:transform .2s,box-shadow .2s}.cc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(11,31,58,.12)}

.vp{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}.vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ls{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;font:600 14px Manrope,sans-serif;color:var(--ink);cursor:pointer}.ls:hover{background:var(--bg)}.ls.on{background:#E0EDFF;color:var(--p)}

footer{background:var(--ink);color:#AEB9CC;text-align:center;padding:32px 20px;font-size:14px}
</style>

const thumb=(c,i)=>/^https:\/\//.test(c.thumb||'')?'<div class="th" style="background:#0B1F3A;padding:0"><img src="'+esc(c.thumb)+'" alt="" style="width:100%;height:100%;object-fit:cover"></div>':'<div class="th" style="background:'+PAL[i%4]+'"><div class="tl">IMPERIA SKILL</div><div class="tg">COURSE</div><div class="tt">'+esc(c.title)+'</div><div class="pb"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#1D4ED8"/></svg></div></div>';
const loadCourses=async()=>{try{const d=(await getDoc(doc(db,'config','course'))).data()||{};let c=d.courses||[];if(!c.length&&(d.lessons||[]).length)c=[{title:'Course',desc:'',thumb:'',lessons:d.lessons}];return c}catch(e){return null}};
const getCS=async()=>(await loadCourses())||[];
const saveCS=c=>setDoc(doc(db,'config','course'),{courses:c},{merge:true});
const loadProf=async()=>(await getDoc(doc(db,'users',me.uid))).data();
const isAdmin=()=>me&&me.email.toLowerCase()===ADMIN.toLowerCase();

function nav(){
 $('#nav').innerHTML='<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">'+LOGO+'<div style="display:flex;gap:10px">'+(me?'<button class="btn o" id="lo">Logout</button>':'<a class="btn o" href="#login">Login</a><a class="btn" href="#signup">Sign Up</a>')+'</div></div>';
 if($('#lo'))$('#lo').onclick=()=>signOut(auth);
}
onAuthStateChanged(auth,async u=>{if(busy)return;me=u;prof=null;if(u){try{prof=await loadProf()}catch(e){}}route()});
addEventListener('hashchange',route);
setTimeout(()=>{if($('.splash'))app.innerHTML='<div class="box">Load nahi hua. Internet check karke page dobara kholo.</div>'},15000);
function route(){
 nav();
 const h=location.hash.slice(1)||'home';
 if(!me)return({signup:vSignup,login:vLogin}[h]||vHome)();
 if(isAdmin())return vAdmin();
 return prof&&prof.status==='active'?vDash():vPay();
}

</section>

<div class="c" style="padding:12px">${thumb({title:'YouTube Automation'},1)}<div style="padding:14px 6px 6px"><h3 style="font-size:20px">YouTube Automation</h3><p class="mut" style="margin:0 0 14px;font-size:14px">YouTube channel setup, video ideas aur scripts, AI voice aur editing tools, upload automation, aur channel grow karne ki strategy.</p><a class="btn" href="#signup" style="padding:10px 22px;font-size:14px">Enroll Now</a></div></div>
<div class="c" style="padding:12px">${thumb({title:'Trending Topics'},2)}<div style="padding:14px 6px 6px"><h3 style="font-size:20px">Trending Topics</h3><p class="mut" style="margin:0 0 14px;font-size:14px">Naye trends, AI tools aur updates jo course mein time ke saath add hote rahenge.</p><a class="btn" href="#signup" style="padding:10px 22px;font-size:14px">Enroll Now</a></div></div></div></div></section>

<div class="c" style="flex:1 1 300px;color:var(--ink)"><b>Commission ka hisaab</b><div class="row" style="margin-top:10px"><span>1 sale</span><b style="color:var(--p)">Rs. 700</b></div><div class="row"><span>3 sales</span><b style="color:var(--p)">Rs. 2,100</b></div><div class="row"><span>10 sales</span><b style="color:var(--p)">Rs. 7,000</b></div><p class="mut" style="font-size:13px;margin:8px 0 0">Commission sirf approved sales par milta hai. Kamai aap ki sales par depend karti hai.</p></div></div></section>

<div class="c" style="margin-bottom:12px"><b>Course kab unlock hoga?</b><div class="mut">Payment verify hone ke baad aap ka account activate ho jata hai.</div></div>

function vLogin(){
 set('<div class="box"><h2 style="font-size:26px;margin:0 0 4px">Login</h2><label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn full" id="go">Login</button><p class="mut" style="text-align:center;font-size:14px">Naya account? <a href="#signup" style="color:var(--p);font-weight:700">Sign Up</a></p></div>');
 $('#go').onclick=async()=>{$('#go').disabled=true;try{await signInWithEmailAndPassword(auth,$('#e').value.trim(),$('#p').value)}catch(x){$('#go').disabled=false;$('#er').textContent=msg(x)}};
}

function vSignup(){
 set(`<div class="box"><div class="st"><span class="on">1. Sign up</span><span>2. Payment</span><span>3. Proof</span></div><h2 style="font-size:26px;margin:0 0 4px">Account banao</h2><p class="mut" style="margin:0">Email aur password daalo, phir Next karo.</p>
<label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password</label><input id="p" type="password" autocomplete="new-password" placeholder="Kam az kam 6 characters"><label for="r">Referral code (optional)</label><input id="r" value="${esc(new URLSearchParams(location.search).get('ref')||'')}">
<div class="err" id="er"></div><button class="btn full" id="go">Next</button><p class="mut" style="text-align:center;font-size:14px">Pehle se account hai? <a href="#login" style="color:var(--p);font-weight:700">Login</a></p></div>`);
 $('#go').onclick=async()=>{
  const e=$('#e').value.trim(),p=$('#p').value,r=$('#r').value.trim().toUpperCase(),er=$('#er');er.textContent='';
  if(!e||p.length<6)return er.textContent='Email aur kam az kam 6 characters ka password likhein.';
  $('#go').disabled=true;busy=true;
  try{
   const {user}=await createUserWithEmailAndPassword(auth,e,p);me=user;
   let by=null;if(r){const s=await getDoc(doc(db,'refCodes',r));if(s.exists()&&s.data().uid!==user.uid)by=s.data().uid}
   const code=Math.random().toString(36).slice(2,8).toUpperCase();
   await setDoc(doc(db,'users',user.uid),{email:e,refCode:code,referredBy:by,status:'pending',balance:0,createdAt:serverTimestamp()});
   await setDoc(doc(db,'refCodes',code),{uid:user.uid});
   prof=await loadProf();busy=false;location.hash='payment';route();
  }catch(x){busy=false;$('#go').disabled=false;er.textContent=msg(x)}
 };
}

async function vPay(){
 set('<div class="box"><p class="mut"><div class="sp"></div></p></div>');
 const [pd,ps]=await Promise.all([getDoc(doc(db,'config','payment')),getDoc(doc(db,'payments',me.uid))]);
 const d=pd.data()||{},p=ps.exists()?ps.data():null,sub=p&&p.status==='submitted';
 const st='<div class="st"><span>1. Sign up</span><span class="on">2. Payment</span><span'+(sub?' class="on"':'')+'>3. Proof</span></div>';
 if(sub){
  set('<div class="box">'+st+'<h2 style="font-size:26px;margin:0 0 8px">Verify ho rahi hai</h2><p class="mut">Aap ki payment ka proof mil gaya hai. Verify hote hi course unlock ho jayega.</p><button class="btn full" id="rf">Status check karo</button></div>');
  $('#rf').onclick=async()=>{prof=await loadProf();route()};return;
 }
 set(`<div class="box">${st}<h2 style="font-size:26px;margin:0 0 4px">Payment karo</h2>${p&&p.status==='rejected'?'<div class="err">Pichli payment verify nahi hui. Sahi details ke saath dobara submit karein.</div>':''}<p class="mut" style="margin:0">Neeche di gayi details par Rs. 2,000 bhejo.</p>
<div class="pay"><b style="color:var(--p);font-size:13px">EASYPAISA / NAYAPAY</b><div class="mut" style="font-size:14px;margin-top:8px">Account name</div><b style="font-size:18px">${esc(d.name||'-')}</b><div class="mut" style="font-size:14px;margin-top:8px">Number</div><b style="font-size:24px">${esc(d.number||'-')}</b><div class="mut" style="font-size:14px;margin-top:8px">Amount</div><b style="font-size:18px">Rs. 2,000</b></div>
<b>Payment ke baad</b><label for="t">Transaction ID</label><input id="t"><label for="s">Aap ka Easypaisa / NayaPay number</label><input id="s" inputmode="numeric" placeholder="03XXXXXXXXX"><div class="err" id="er"></div><button class="btn full" id="go">Submit for Approval</button></div>`);
 $('#go').onclick=async()=>{
  const t=$('#t').value.trim(),s=$('#s').value.trim();
  if(t.length<4||!/^03\d{9}$/.test(s))return $('#er').textContent='Transaction ID aur sahi number (03XXXXXXXXX) likhein.';
  $('#go').disabled=true;
  try{await setDoc(doc(db,'payments',me.uid),{uid:me.uid,txnId:t,senderNumber:s,status:'submitted',createdAt:serverTimestamp()});vPay()}
  catch(x){$('#go').disabled=false;$('#er').textContent=msg(x)}
 };
}

async function vDash(){
 prof=await loadProf();
 set('<div class="w sec" style="padding-top:32px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px"><div><div class="mut" style="font-size:14px">Assalam o Alaikum</div><h2 style="margin:0;font-size:28px">'+esc(prof.email.split('@')[0])+'</h2></div><div class="tabs"><button data-t="courses" class="'+(tab==='courses'?'on':'')+'">My Courses</button><button data-t="aff" class="'+(tab==='aff'?'on':'')+'">Affiliate</button></div></div><div id="tb"><div class="sp"></div></div></div>');
 $('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;cur=null;vDash()}};
 tab==='aff'?tAff():tCourses();
}
async function tCourses(){
 const tb=$('#tb');CS=await loadCourses();
 if(CS===null)return tb.innerHTML='<div class="c">Courses load nahi hue. Page dobara kholo.</div>';
 if(!CS.length)return tb.innerHTML='<div class="c">Courses jald add honge.</div>';
 if(cur!==null&&CS[cur])return tPlay();
 tb.innerHTML='<div class="g">'+CS.map((c,i)=>'<div class="cc" data-c="'+i+'">'+thumb(c,i)+'<div style="padding:14px 6px 6px"><h3 style="font-size:19px">'+esc(c.title)+'</h3><p class="mut" style="margin:0 0 12px;font-size:14px">'+esc(c.desc||'')+'</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="mut" style="font-size:13px;font-weight:600">'+(c.lessons||[]).length+' lessons</span><span class="btn" style="padding:10px 20px;font-size:14px">Start Learning</span></div></div></div>').join('')+'</div>';
 tb.onclick=e=>{const b=e.target.closest('[data-c]');if(b){cur=+b.dataset.c;ln=0;tPlay()}};
}
function tPlay(){
 const c=CS[cur],L=(c.lessons||[]).filter(l=>l.title&&embed(l.url));if(ln>=L.length)ln=0;
 $('#tb').innerHTML='<button class="btn o" id="bk" style="padding:10px 18px;margin-bottom:16px">&larr; Saare courses</button><h2 style="margin:0 0 6px;font-size:28px">'+esc(c.title)+'</h2><p class="mut" style="margin:0 0 20px">'+esc(c.desc||'')+'</p>'
 +(L.length?'<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start"><div style="flex:2 1 440px;min-width:0"><div class="vp"><iframe id="fr" src="'+embed(L[ln].url)+'" allow="autoplay;fullscreen" allowfullscreen></iframe></div><h3 style="margin:14px 0 0">'+esc(L[ln].title)+'</h3></div><div class="c" style="flex:1 1 280px;padding:12px" id="pls"><b style="display:block;padding:8px 10px">Course content ('+L.length+' lessons)</b>'+L.map((l,i)=>'<button class="ls'+(i===ln?' on':'')+'" data-l="'+i+'"><span class="n">'+(i+1)+'</span><span>'+esc(l.title)+'</span></button>').join('')+'</div></div>':'<div class="c">Is course ke lessons jald add honge.</div>');
 $('#bk').onclick=()=>{cur=null;tCourses()};
 if(L.length)$('#pls').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;ln=+b.dataset.l;tPlay();$('#fr').scrollIntoView({behavior:'smooth',block:'center'})};
}
function tAff(){
 const link=location.origin+location.pathname+'?ref='+prof.refCode+'#signup';
 $('#tb').innerHTML=`<div class="g"><div class="c" style="background:var(--ink);color:#fff"><div style="color:#AEB9CC;font-size:14px">Affiliate balance</div><div style="font-size:40px;font-weight:800">Rs. ${prof.balance}</div><div style="color:#AEB9CC;font-size:14px">Har sale par Rs. ${COMM} (35%). Minimum withdrawal Rs. ${MIN}.</div></div>
<div class="c"><b>Aap ka referral link</b><input id="rl" readonly value="${esc(link)}" style="margin:10px 0"><button class="btn full" id="cp">Copy Link</button></div></div>
<div class="g" style="margin-top:20px"><div class="c"><h3>Withdrawal</h3><label for="wa">Amount (Rs.)</label><input id="wa" type="number" placeholder="Minimum ${MIN}"><label for="wm">Method</label><select id="wm"><option>Easypaisa</option><option>NayaPay</option></select><label for="wc">Account number</label><input id="wc" inputmode="numeric" placeholder="03XXXXXXXXX"><div class="err" id="we"></div><button class="btn full" id="wb">Request Withdrawal</button></div>
<div class="c"><h3>Withdrawal history</h3><div id="wh" class="mut"><div class="sp"></div></div></div></div>`;
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('#cp').textContent='Copied!'}catch(e){$('#rl').select()}};
 $('#wb').onclick=async()=>{
  const a=Number($('#wa').value),c=$('#wc').value.trim(),m=$('#wm').value,er=$('#we');
  if(!(a>=MIN))return er.textContent='Minimum withdrawal Rs. '+MIN+' hai.';
  if(a>prof.balance)return er.textContent='Aap ka balance kam hai.';
  if(!/^03\d{9}$/.test(c))return er.textContent='Sahi account number likhein (03XXXXXXXXX).';
  $('#wb').disabled=true;
  try{await addDoc(collection(db,'withdrawals'),{uid:me.uid,amount:a,method:m,account:c,status:'pending',createdAt:serverTimestamp()});vDash()}
  catch(x){$('#wb').disabled=false;er.textContent=msg(x)}
 };
 (async()=>{try{const q=await getDocs(query(collection(db,'withdrawals'),where('uid','==',me.uid)));
  const W=q.docs.map(d=>d.data()).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  $('#wh').innerHTML=W.length?W.map(w=>'<div class="row"><span>Rs. '+w.amount+' ('+esc(w.method)+')</span><b>'+({pending:'Pending',paid:'Paid',rejected:'Rejected'}[w.status]||'')+'</b></div>').join(''):'Abhi koi withdrawal nahi.'}catch(e){$('#wh').textContent='Load nahi hua.'}})();
}

async function vAdmin(){
 set('<div class="w sec"><h2>Admin Panel</h2><h3>Payment details (students ko sign up ke baad dikhte hain)</h3><div class="c" style="margin-bottom:28px"><label for="pn">Account name</label><input id="pn"><label for="pm">Number</label><input id="pm" inputmode="numeric"><div class="err" id="pe"></div><button class="btn full" id="ps">Save payment details</button></div><h3>Courses</h3><div class="c" style="margin-bottom:16px"><b>Naya course banao</b><label for="ct">Course ka naam</label><input id="ct" placeholder="Jaise: TikTok Automation"><label for="cd">Chhoti description</label><input id="cd"><label for="cu">Thumbnail image ka link (optional)</label><input id="cu" placeholder="Khali chhor do to khud thumbnail ban jayega"><div class="err" id="ce"></div><button class="btn full" id="cb">Course add karo</button></div><div class="c" style="margin-bottom:16px"><b>Lesson add karo</b><label for="cs">Course chuno</label><select id="cs"></select><label for="lt">Lesson ka title</label><input id="lt"><label for="lu">Video ka link (Google Drive ya YouTube)</label><input id="lu"><div class="err" id="le"></div><button class="btn full" id="la">Lesson add karo</button></div><div id="cl" style="margin-bottom:28px"></div><h3>Payments (pending)</h3><div id="ap" class="mut"><div class="sp"></div></div><h3 style="margin-top:32px">Withdrawals (pending)</h3><div id="aw" class="mut"><div class="sp"></div></div></div>');

 try{const pd=(await getDoc(doc(db,'config','payment'))).data()||{};$('#pn').value=pd.name||'';$('#pm').value=pd.number||''}catch(e){}
 $('#ps').onclick=async()=>{const n=$('#pn').value.trim(),m=$('#pm').value.trim(),pe=$('#pe');pe.style.color='';
  if(!n||!/^03\d{9}$/.test(m))return pe.textContent='Naam aur sahi number (03XXXXXXXXX) likhein.';
  try{await setDoc(doc(db,'config','payment'),{name:n,number:m});pe.style.color='#067647';pe.textContent='Save ho gaya!'}catch(x){pe.textContent=msg(x)}};
 const showC=async()=>{const C=await getCS();$('#cs').innerHTML=C.map((c,i)=>'<option value="'+i+'">'+esc(c.title)+'</option>').join('');
  $('#cl').innerHTML=C.length?C.map((c,i)=>'<div class="c" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>'+esc(c.title)+'</b><button class="btn o" style="padding:8px 14px;font-size:13px" data-a="dc" data-i="'+i+'">Course delete</button></div>'+(c.lessons||[]).map((l,j)=>'<div class="row" style="align-items:center"><span class="mut">'+(j+1)+'. '+esc(l.title)+'</span><button class="btn o" style="padding:6px 12px;font-size:13px" data-a="dl" data-i="'+i+'" data-j="'+j+'">Hatao</button></div>').join('')+'</div>').join(''):'<div class="mut">Abhi koi course nahi.</div>'};
 showC();
 $('#cb').onclick=async()=>{const t=$('#ct').value.trim(),d=$('#cd').value.trim(),u=$('#cu').value.trim(),ce=$('#ce');
  if(!t)return ce.textContent='Course ka naam likhein.';
  if(u&&!/^https:\/\//.test(u))return ce.textContent='Thumbnail link https:// se shuru hona chahiye.';
  try{const C=await getCS();C.push({title:t,desc:d,thumb:u,lessons:[]});await saveCS(C);$('#ct').value='';$('#cd').value='';$('#cu').value='';ce.textContent='';showC()}catch(x){ce.textContent=msg(x)}};
 $('#la').onclick=async()=>{const t=$('#lt').value.trim(),u=$('#lu').value.trim(),le=$('#le');
  if(!$('#cs').value)return le.textContent='Pehle course banao.';
  if(!t||!embed(u))return le.textContent='Title aur Google Drive ya YouTube ka link likhein.';
  try{const C=await getCS(),i=+$('#cs').value;(C[i].lessons=C[i].lessons||[]).push({title:t,url:u});await saveCS(C);$('#lt').value='';$('#lu').value='';le.textContent='';showC()}catch(x){le.textContent=msg(x)}};
 const em=async uid=>((await getDoc(doc(db,'users',uid))).data()||{}).email;
 const P=await getDocs(query(collection(db,'payments'),where('status','==','submitted')));
 $('#ap').innerHTML=(await Promise.all(P.docs.map(async d=>{const x=d.data();return '<div class="c" style="margin-bottom:12px"><b>'+esc(await em(d.id))+'</b><div class="mut">Txn ID: '+esc(x.txnId)+' | Sender: '+esc(x.senderNumber)+'</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-a="ap" data-id="'+d.id+'">Approve</button><button class="btn o" data-a="rp" data-id="'+d.id+'">Reject</button></div></div>'}))).join('')||'Koi pending payment nahi.';
 const W=await getDocs(query(collection(db,'withdrawals'),where('status','==','pending')));
 $('#aw').innerHTML=(await Promise.all(W.docs.map(async d=>{const x=d.data();return '<div class="c" style="margin-bottom:12px"><b>'+esc(await em(x.uid))+'</b><div class="mut">Rs. '+x.amount+' | '+esc(x.method)+' | '+esc(x.account)+'</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-a="aw" data-id="'+d.id+'">Paise bhej diye, Approve</button><button class="btn o" data-a="rw" data-id="'+d.id+'">Reject</button></div></div>'}))).join('')||'Koi pending withdrawal nahi.';
}
app.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||!isAdmin())return;
 const a=b.dataset.a,id=b.dataset.id;b.disabled=true;
 try{
  if(a==='ap')await approvePayment(id);
  if(a==='rp')await updateDoc(doc(db,'payments',id),{status:'rejected'});
  if(a==='aw')await approveWithdrawal(id);
  if(a==='rw')await updateDoc(doc(db,'withdrawals',id),{status:'rejected'});
  if(a==='dc'){const C=await getCS();C.splice(+b.dataset.i,1);await saveCS(C)}
  if(a==='dl'){const C=await getCS();C[+b.dataset.i].lessons.splice(+b.dataset.j,1);await saveCS(C)}
  vAdmin();
 }catch(x){alert(msg(x));b.disabled=false}
});
async function approvePayment(uid){
 await runTransaction(db,async t=>{
  const uR=doc(db,'users',uid),pR=doc(db,'payments',uid),u=await t.get(uR),p=await t.get(pR);
  if(p.data().status!=='submitted')throw new Error('Pehle hi handle ho chuka hai');
  const ru=u.data().referredBy,rR=ru?doc(db,'users',ru):null,r=rR?await t.get(rR):null;
  t.update(pR,{status:'approved'});t.update(uR,{status:'active'});
  if(r&&r.data().status==='active')t.update(rR,{balance:increment(COMM)});
 });
}
async function approveWithdrawal(id){
 await runTransaction(db,async t=>{
  const wR=doc(db,'withdrawals',id),w=await t.get(wR),uR=doc(db,'users',w.data().uid),u=await t.get(uR);
  if(w.data().status!=='pending'||u.data().balance<w.data().amount)throw new Error('Approve nahi ho sakta');
  t.update(wR,{status:'paid'});t.update(uR,{balance:increment(-w.data().amount)});
 });
}
</script>
